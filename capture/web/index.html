<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blurt</title>
<meta name="theme-color" content="#2e2b25">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="/frontend/mockups/_ds/organic-d78833b6-7fe1-4f47-8711-04fb39094145/styles.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone">
    <nav class="nav">
      <span></span>
      <a href="/frontend/web/" class="btn btn-icon" aria-label="Back to home feed" style="color:var(--color-bg)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </a>
    </nav>
    <main id="capture-main">
      <div class="mic-wrap">
        <div id="pulse-1" class="pulse-ring" hidden></div>
        <div id="pulse-2" class="pulse-ring d2" hidden></div>
        <div id="pulse-3" class="pulse-ring d3" hidden></div>
        <button id="mic-btn" class="btn" aria-label="Blurt it out">
          <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </button>
      </div>
      <p id="status" aria-live="polite">tap. speak. done.</p>
      <p id="stop-hint" hidden>tap anywhere to stop</p>

      <form id="type-form">
        <input id="type-input" class="input" type="text" placeholder="or type it" autocomplete="off">
      </form>

      <ul id="recent"></ul>
    </main>

    <div id="toast" role="status" aria-live="polite">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent-2-700)" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      <span id="toast-text"></span>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
